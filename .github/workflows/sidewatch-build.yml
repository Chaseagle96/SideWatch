name: SideWatch macOS Xcode build

on:
  push:
    branches: [watch-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sidewatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SideStore watch-support fork
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checkout identity and cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git status --short
          test -f Dependencies/AltSign/Package.swift
          test -f Dependencies/minimuxer/Package.swift

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          command -v ldid
          command -v xcbeautify

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project AltStore.xcodeproj \
            -scheme SideStore \
            2>&1 | tee package-resolution.log

      - name: Run recursive IPA regression tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee python-tests.log

      - name: Run AltSign model and reconciliation tests
        shell: bash
        run: |
          set -o pipefail
          swift test \
            --package-path Dependencies/AltSign \
            2>&1 | tee altsign-tests.log

      - name: Build archive and IPA
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci/workflow.py build 2>&1 | tee build-run.log
          cp SideStore.ipa SideWatch-Unsigned.ipa
          shasum -a 256 SideWatch-Unsigned.ipa | tee SideWatch-Unsigned.ipa.sha256

      - name: Verify unsigned IPA structure recursively
        shell: bash
        run: |
          set -euo pipefail
          test -s SideWatch-Unsigned.ipa
          unzip -tq SideWatch-Unsigned.ipa
          python3 scripts/validate_ipa.py \
            SideWatch-Unsigned.ipa \
            --structure-only \
            | tee ipa-structure-validation.md
          unzip -Z1 SideWatch-Unsigned.ipa | grep -Eq '^Payload/[^/]+\.app/SideBackup\.ipa$'
          unzip -Z1 SideWatch-Unsigned.ipa | grep -Eq '^Payload/[^/]+\.app/PlugIns/[^/]+\.appex/'

      - name: Prove artifact is not mislabeled as installable
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/validate_ipa.py \
            SideWatch-Unsigned.ipa \
            --verify-codesign \
            --json \
            > ipa-signed-validation.json
          validation_status=$?
          set -e
          test "$validation_status" -ne 0
          grep -q 'embedded.mobileprovision is missing' ipa-signed-validation.json
          echo "The unsigned AltServer input correctly fails signed-installability validation."

      - name: Write verification status
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status = {
              "commit": os.environ["GITHUB_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "compile": "PASS",
              "python_regression_tests": "PASS",
              "altsign_swift_tests": "PASS",
              "ipa_structure": "PASS",
              "artifact_class": "UNSIGNED_ALT_SERVER_INPUT",
              "signed_installability": "NOT_TESTED_NO_CREDENTIALS",
              "device_install": "NOT_TESTED",
              "watch_device_install": "NOT_TESTED",
          }
          Path("ci-verification-status.json").write_text(
              json.dumps(status, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload unsigned AltServer input IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideWatch-UNSIGNED-AltServer-input-${{ github.run_number }}
          path: |
            SideWatch-Unsigned.ipa
            SideWatch-Unsigned.ipa.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dSYMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideWatch-dSYMs-${{ github.run_number }}
          path: SideStore.dSYMs.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideWatch-build-logs-${{ github.run_number }}
          path: |
            build-run.log
            package-resolution.log
            python-tests.log
            altsign-tests.log
            ipa-structure-validation.md
            ipa-signed-validation.json
            ci-verification-status.json
            build/logs/**
          if-no-files-found: warn
          retention-days: 14
